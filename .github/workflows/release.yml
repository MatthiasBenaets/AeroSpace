name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - run: ./.github/gh-actions-runner-xcode-select.sh
      - run: brew update && brew install bash fish xcbeautify swiftly xcodegen rust ruby
      - run: swiftly init --skip-install --assume-yes --verbose && swiftly install
      - run: swiftly run swift --version

      - name: Install Ruby gems for man pages
        run: bundle install

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release
        run: |
          ./build-release.sh \
            --build-version "${{ steps.version.outputs.version }}" \
            --codesign-identity "-"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .release/AeroSpace-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
